name: Publish to VS Code Marketplace

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package
      - name: Publish extension
        run: npx vsce publish --packagePath dist/Goland-Style.vsix --allow-missing-repository --no-yarn
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
