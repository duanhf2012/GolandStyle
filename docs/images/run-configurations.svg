  <text x="330" y="174" fill="#858A94" font-family="Segoe UI Symbol, sans-serif" font-size="18">⚙</text>
  <text x="365" y="174" fill="#858A94" font-family="Segoe UI Symbol, sans-serif" font-size="17">↻</text>
  <g font-family="Segoe UI, sans-serif" font-size="13">
    <rect x="22" y="188" width="366" height="42" rx="6" fill="#33353B"/>
    <text x="40" y="208" fill="#E1E3E8">🐹  Go: Debug Package</text>
    <text x="64" y="223" fill="#777B84" font-size="11">go · launch · auto</text>
    <text x="330" y="214" fill="#7FC97F" font-size="18">▶</text><text x="365" y="214" fill="#69A7E8" font-size="17">◆</text>
    <text x="40" y="260" fill="#BCBEC4">🐹  Go: Debug Current Test</text>
    <text x="64" y="275" fill="#777B84" font-size="11">go · launch · test</text>
    <text x="40" y="312" fill="#BCBEC4">🐹  Go: Attach to Delve</text>
    <text x="64" y="327" fill="#777B84" font-size="11">go · attach · remote</text>
  </g>
  <rect x="22" y="626" width="366" height="55" rx="7" fill="#202124" stroke="#34363B"/>
  <text x="40" y="650" fill="#BCBEC4" font-family="Segoe UI, sans-serif" font-size="12">单击配置打开表单</text>
  <text x="40" y="669" fill="#858A94" font-family="Segoe UI, sans-serif" font-size="11">右侧按钮可直接运行或调试</text>

  <rect x="400" y="53" width="870" height="657" fill="#202124"/>
  <rect x="422" y="72" width="826" height="72" rx="9" fill="#26282C" stroke="#34363B"/>
  <text x="445" y="100" fill="#858A94" font-family="Segoe UI, sans-serif" font-size="12">名称</text>
  <rect x="500" y="82" width="550" height="34" rx="5" fill="#191A1C" stroke="#45484F"/>
  <text x="515" y="104" fill="#E1E3E8" font-family="Segoe UI, sans-serif" font-size="13">Go: Debug Package</text>
  <rect x="1068" y="82" width="82" height="34" rx="5" fill="#33353B"/>
