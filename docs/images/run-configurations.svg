  <rect x="422" y="622" width="826" height="66" rx="9" fill="#26282C" stroke="#34363B"/>
  <rect x="1015" y="638" width="94" height="34" rx="5" fill="#33353B" stroke="#50535A"/>
  <text x="1062" y="660" text-anchor="middle" fill="#D7D9DE" font-family="Segoe UI, sans-serif" font-size="13">运行</text>
  <rect x="1122" y="638" width="102" height="34" rx="5" fill="#365F95"/>
  <text x="1173" y="660" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, sans-serif" font-size="13">调试</text>
