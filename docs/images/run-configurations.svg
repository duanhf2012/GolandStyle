<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">GoLand 风格运行调试配置编辑器示意</title>
  <desc id="desc">VS Code 运行和调试侧栏中的配置列表，以及 launch.json 可视化编辑表单。</desc>
  <rect width="1280" height="720" rx="18" fill="#111214"/>
  <rect x="10" y="10" width="1260" height="700" rx="12" fill="#191A1C" stroke="#34363B"/>
  <rect x="10" y="10" width="1260" height="43" rx="12" fill="#26282C"/>
  <text x="32" y="37" fill="#E1E3E8" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600">运行/调试配置</text>
  <text x="1250" y="37" text-anchor="end" fill="#858A94" font-family="Segoe UI, sans-serif" font-size="13">launch.json 可视化编辑 · 界面示意</text>

  <rect x="10" y="53" width="390" height="657" fill="#191A1C" stroke="#2E3035"/>
