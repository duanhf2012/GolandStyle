    <text x="447" y="516">环境变量文件</text>
    <text x="447" y="562">启动前任务</text>
  </g>
  <g fill="#191A1C" stroke="#45484F">
    <rect x="555" y="172" width="265" height="32" rx="4"/><rect x="555" y="218" width="265" height="32" rx="4"/>
    <rect x="555" y="264" width="265" height="32" rx="4"/><rect x="555" y="310" width="665" height="32" rx="4"/>
    <rect x="555" y="356" width="665" height="32" rx="4"/><rect x="555" y="402" width="665" height="32" rx="4"/>
    <rect x="555" y="448" width="665" height="32" rx="4"/><rect x="555" y="494" width="665" height="32" rx="4"/>
    <rect x="555" y="540" width="665" height="32" rx="4"/>
  </g>
  <g font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#D7D9DE">
    <text x="570" y="193">go</text><text x="570" y="239">launch</text><text x="570" y="285">auto</text>
    <text x="570" y="331">${workspaceFolder}</text><text x="570" y="377">${workspaceFolder}</text>
    <text x="570" y="423">-tags=integration</text><text x="570" y="469">--config ./config/dev.yaml</text>
    <text x="570" y="515">${workspaceFolder}/.env</text><text x="570" y="561">Go: Build All</text>
  </g>
  <text x="793" y="194" fill="#858A94" font-family="Segoe UI Symbol, sans-serif">⌄</text>
  <text x="793" y="240" fill="#858A94" font-family="Segoe UI Symbol, sans-serif">⌄</text>
