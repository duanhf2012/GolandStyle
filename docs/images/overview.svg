    <text x="363" y="256" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">1</text>
    <text x="414" y="132" fill="#CF8E6D">package</text><text x="486" y="132" fill="#BCBEC4"> main</text>
    <text x="414" y="180" fill="#CF8E6D">import</text><text x="470" y="180" fill="#6AAB73"> "net/http"</text>
    <text x="414" y="228" fill="#CF8E6D">func</text><text x="454" y="228" fill="#56A8F5"> main</text><text x="500" y="228" fill="#BCBEC4">() {</text>
    <text x="446" y="252" fill="#BCBEC4">mux </text><text x="478" y="252" fill="#CF8E6D">:=</text><text x="510" y="252" fill="#6FAFBD"> http</text><text x="554" y="252" fill="#BCBEC4">.</text><text x="562" y="252" fill="#B09D79">NewServeMux</text><text x="660" y="252" fill="#BCBEC4">()</text>
    <text x="446" y="276" fill="#BCBEC4">mux.</text><text x="478" y="276" fill="#B09D79">HandleFunc</text><text x="566" y="276" fill="#BCBEC4">(</text><text x="574" y="276" fill="#6AAB73">"/health"</text><text x="654" y="276" fill="#BCBEC4">, health)</text>
    <text x="446" y="300" fill="#6FAFBD">http</text><text x="478" y="300" fill="#BCBEC4">.</text><text x="486" y="300" fill="#B09D79">ListenAndServe</text><text x="614" y="300" fill="#BCBEC4">(</text><text x="622" y="300" fill="#6AAB73">":8080"</text><text x="686" y="300" fill="#BCBEC4">, mux)</text>
    <text x="414" y="324" fill="#BCBEC4">}</text>
    <text x="414" y="372" fill="#CF8E6D">func</text><text x="454" y="372" fill="#56A8F5"> health</text><text x="518" y="372" fill="#BCBEC4">(w http.ResponseWriter, r *http.Request) {</text>
    <text x="446" y="396" fill="#56A8F5">fmt</text><text x="470" y="396" fill="#BCBEC4">.</text><text x="478" y="396" fill="#B09D79">Fprintln</text><text x="542" y="396" fill="#BCBEC4">(w, </text><text x="574" y="396" fill="#6AAB73">"ok"</text><text x="606" y="396" fill="#BCBEC4">)</text>
    <text x="414" y="420" fill="#BCBEC4">}</text>
